site_name: pydsa
site_description: data structure and algorithm helpers for LeetCode-style Python
site_url: https://www.shyal.com/pydsa/
repo_url: https://github.com/shyal/pydsa
repo_name: shyal/pydsa
edit_uri: ""
strict: true
hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - API:
      - grid: api/grid.md
      - adj: api/adj.md
      - search: api/search.md
      - heaps: api/heaps.md
      - counting: api/counting.md
      - combo: api/combo.md
      - digits: api/digits.md
      - arith: api/arith.md
      - seq: api/seq.md
      - generators: api/generators.md
      - nodes: api/nodes.md
      - tree: api/tree.md
      - bst: api/bst.md
      - linked: api/linked.md
      - graphs: api/graphs.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_root_heading: false
            show_root_toc_entry: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            heading_level: 2
            filters: ["!^_"]

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
