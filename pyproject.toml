[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# "pydsa" is taken on PyPI (a dormant 2018 upload) and "dsa-py" is too close
# to the existing "dsapy"; the import name stays pydsa
name = "pizza-lib"
version = "0.3.1"
description = "Data structure and algorithm helpers for LeetCode-style Python: grids, adjacency, binary search bounds, heaps, trees, linked lists."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shyal" }]
keywords = ["leetcode", "algorithms", "data-structures", "grid", "graph", "heap", "binary-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education",
]
dependencies = ["mu-language>=0.12.3"]  # the modules written in mu import through it

[project.urls]
Homepage = "https://github.com/shyal/pydsa"
Repository = "https://github.com/shyal/pydsa"
Documentation = "https://www.shyal.com/pydsa/"

[project.optional-dependencies]
# pymdown-extensions 12 breaks mkdocstrings 1.0 (Highlight.__init__ needs md)
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27", "pymdown-extensions<12", "ruff", "mu-language>=0.12.3"]
draw = ["rich", "colorama", "PrettyPrintTree", "graphviz", "tabulate", "networkx", "phart"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pydsa*"]

[tool.setuptools.package-data]
pydsa = ["*.mu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E741", "B007", "B905"]
